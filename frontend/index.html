<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XBM - X Bookmarks</title>
  <!-- Inline so the browser stops requesting /favicon.ico and logging a 404. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%232563eb' d='M4 1h8a1 1 0 0 1 1 1v13l-5-3.5L3 15V2a1 1 0 0 1 1-1z'/></svg>" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>XBM</h1>
    <div class="topbar-actions">
      <span id="sync-status" class="sync-status"></span>
      <button id="sync-btn">Sync now</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <button class="nav-item active" data-view="search" type="button">All bookmarks</button>
      <button class="nav-item" data-view="watch-later" type="button">Watch later</button>
      <h2>Tags</h2>
      <ul id="tag-list" class="tag-list"></ul>
    </nav>

    <main>
      <section id="search-view" class="view">
        <input id="search-input" type="search" placeholder="Search bookmarks..." autocomplete="off" />
        <div id="results" class="results"></div>
        <button id="load-more" class="load-more" type="button" hidden>Load more</button>
        <p id="results-status" class="status-line"></p>
      </section>

      <section id="watch-later-view" class="view" hidden>
        <div class="wl-filters">
          <button class="wl-filter active" data-status="unwatched" type="button">Unwatched</button>
          <button class="wl-filter" data-status="watched" type="button">Watched</button>
          <button class="wl-filter" data-status="" type="button">All</button>
        </div>
        <div id="watch-later-results" class="results"></div>
        <p id="watch-later-status" class="status-line"></p>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
