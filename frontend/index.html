<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Later — X Bookmarks Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="xbroot" id="root" data-app-theme="light">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">Later</div>
        <div class="brand-kicker">x bookmarks library</div>
      </div>

      <nav class="nav">
        <button class="nav-item" data-view="library" type="button">
          <span>Library</span>
          <span class="nav-count" id="lib-count"></span>
        </button>
        <button class="nav-item" data-view="queue" type="button">
          <span>Watch Later</span>
          <span class="nav-count" id="queue-count"></span>
        </button>
      </nav>

      <div class="tags-section">
        <div class="section-label">Tags</div>
        <div class="tag-list" id="tag-list"></div>
      </div>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" type="button"></button>
        <div class="sync-box" id="sync-box"></div>
        <div class="sync-note">each sync bills x api reads</div>
      </div>
    </aside>

    <main class="content" id="content"></main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
