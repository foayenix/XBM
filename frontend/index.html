<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Later — X Bookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    document.documentElement.dataset.theme =
      localStorage.getItem("xbm-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">Later</div>
      <div class="brand-sub">x bookmarks library</div>
    </div>
    <nav class="nav">
      <button id="nav-library" class="nav-item" type="button">
        <span>Library</span><span id="nav-library-count" class="nav-count"></span>
      </button>
      <button id="nav-queue" class="nav-item" type="button">
        <span>Watch Later</span><span id="nav-queue-count" class="nav-count"></span>
      </button>
    </nav>
    <div class="sidebar-tags">
      <div class="side-label">Tags</div>
      <div id="tag-list" class="tag-list"></div>
    </div>
    <div class="sidebar-footer">
      <button id="theme-toggle" class="theme-toggle" type="button"></button>
      <div id="sync-area" class="sync-area"></div>
      <div class="sync-note">each sync bills x api reads</div>
    </div>
  </aside>

  <main id="main"></main>

  <script src="/static/app.js"></script>
</body>
</html>
