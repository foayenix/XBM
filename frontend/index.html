<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XBM - X Bookmarks</title>
  <!-- Inline so the browser stops requesting /favicon.ico and logging a 404. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%232563eb' d='M4 1h8a1 1 0 0 1 1 1v13l-5-3.5L3 15V2a1 1 0 0 1 1-1z'/></svg>" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>XBM</h1>
    <div class="topbar-actions">
      <span id="sync-status" class="sync-status" role="status" aria-live="polite"></span>
      <button id="sync-btn">Sync now</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Views and tag filters">
      <div class="sidebar-nav">
        <button class="nav-item" data-view="search" type="button" aria-current="page">All bookmarks</button>
        <button class="nav-item" data-view="watch-later" type="button">Watch later</button>
      </div>
      <h2 id="tags-heading">Tags</h2>
      <ul id="tag-list" class="tag-list" aria-labelledby="tags-heading"></ul>
    </nav>

    <main>
      <section id="search-view" class="view" aria-label="All bookmarks">
        <label class="field-label" for="search-input">Search bookmarks</label>
        <input id="search-input" type="search" placeholder="Title, author, tag, article text..." autocomplete="off" />
        <div id="results" class="results"></div>
        <button id="load-more" class="load-more" type="button" hidden>Load more</button>
        <p id="results-status" class="status-line" role="status" aria-live="polite"></p>
      </section>

      <section id="watch-later-view" class="view" aria-label="Watch later" hidden>
        <div class="wl-filters" role="group" aria-label="Filter by watched state">
          <button class="wl-filter" data-status="unwatched" type="button" aria-pressed="true">Unwatched</button>
          <button class="wl-filter" data-status="watched" type="button" aria-pressed="false">Watched</button>
          <button class="wl-filter" data-status="" type="button" aria-pressed="false">All</button>
        </div>
        <div id="watch-later-results" class="results"></div>
        <p id="watch-later-status" class="status-line" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
