name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the README states; 3.13 guards against the next
        # version breaking us.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # UI tests need a browser; they get their own job below.
        run: pytest -m "not ui"

  ui:
    # Browser-level checks: responsive behaviour, touch targets, contrast,
    # focus visibility, ARIA state. These need a real layout engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Run UI tests
        run: pytest -m ui

  lockfile:
    # The resolved versions in requirements.lock must still satisfy the
    # floors in requirements.txt, so the two cannot drift apart unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install from the lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest
      - name: Check the lockfile satisfies requirements.txt
        run: pip install --dry-run --no-deps -r requirements.txt
      - name: Run tests against locked versions
        run: pytest -m "not ui"
